name: MacroFlow CI Pipeline

on:
  push:
    branches: [ "main", "master", "fix/audit-curation" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  code-quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Java Runtime for PySpark Engine
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Project & Airflow Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "apache-airflow>=2.9.0,<3.0.0" "apache-airflow-providers-databricks>=6.0.0,<8.0.0"

      - name: Static Code Analysis (Ruff Linter & Formatter)
        run: |
          ruff check .
          ruff format --check .

      - name: Static Type Checking (Mypy)
        env:
          MYPYPATH: .
        run: |
          mypy src/ airflow/dags/ --ignore-missing-imports

      - name: Validate Airflow DagBag Integrity
        env:
          PYTHONPATH: .
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
          AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "sqlite:////tmp/airflow_ci.db"
        run: |
          airflow db migrate
          python -c "from airflow.models import DagBag; db = DagBag(dag_folder='airflow/dags'); assert not db.import_errors, db.import_errors; assert {'macroflow_ingestion_bronze', 'macroflow_ml_inference_batch'}.issubset(db.dag_ids), db.dag_ids; print('DagBag OK:', sorted(db.dag_ids))"

      - name: Execute Automated Unit Tests & Coverage Gate (Pytest)
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v --tb=short --cov=src --cov-report=term-missing --cov-fail-under=80
