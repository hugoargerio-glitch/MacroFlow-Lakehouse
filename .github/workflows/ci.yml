name: MacroFlow CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  code-quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Java Runtime for PySpark Engine
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Static Code Analysis (Ruff Linter & Formatter)
        run: |
          echo "Executando inspeção estática com Ruff..."
          ruff check .
          ruff format --check .

      - name: Execute Automated Unit Tests (Pytest)
        env:
          PYTHONPATH: .
        run: |
          echo "Executando suite de testes automatizados..."
          pytest tests/ -v --tb=short
